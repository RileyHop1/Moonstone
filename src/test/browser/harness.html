<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Moonstone editor harness</title>
        <style>
            /*
             * Deliberately mirrors the shape of the project page's editor
             * panel — a flex column that clips its overflow — because
             * several editor behaviours (tooltip placement, scrolling)
             * depend on being inside a clipped, sized container.
             */
            html,
            body {
                margin: 0;
                height: 100%;
            }

            #harness-root {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <div id="harness-root"></div>
        <script type="module" src="./harness.tsx"></script>
    </body>
</html>
