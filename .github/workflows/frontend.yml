# Typecheck, lint, unit-test and browser-test the Vite/React frontend.
#
# The Rust workflow covers `src-tauri` only, which left the ~19k lines of
# TypeScript — and every one of its tests — running on developer machines
# and nowhere else.
name: Frontend

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  # Callable from the release workflow, so a release is gated on the
  # same checks a pull request is rather than on a second copy of them.
  workflow_call:

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium is configured in playwright.config.ts, so the other
      # browser downloads would be dead weight.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Lint findings arrive as inline review comments on the pull request
  # rather than as a wall of log output someone has to read by hand.
  reviewdog:
    name: ESLint review comments
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run reviewdog
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          eslint_flags: "."
